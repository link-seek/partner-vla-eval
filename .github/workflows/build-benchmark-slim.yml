name: Build Benchmark Slim

# 外网构建活：免费机打 robotwin-slim → SWR（V100/hw21 几乎内网，不能打）。
# 与 GPU 队列完全并行（不同 runner）。CuRobo 编译 arch 收到 7.0（V100 only），省 RAM/时间；
# 等价性由后续 grab_roller×50（±8pp）覆盖。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SWR tag"
        required: false
        default: "slim-0.8.0"

permissions:
  contents: read

env:
  SWR_REG: swr.cn-north-4.myhuaweicloud.com/link-seek

jobs:
  build-slim:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (conservative)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h / | tail -n 1
      - name: Login SWR (HMAC)
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          echo "$LOGIN_KEY" | docker login -u "cn-north-4@${{ secrets.OBS_AK }}" --password-stdin swr.cn-north-4.myhuaweicloud.com
      - name: Clone harness v0.8.0 as build context
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/allenai/vla-evaluation-harness.git harness-build
          ls harness-build/pyproject.toml harness-build/src >/dev/null
      - name: Build + push robotwin-slim
        run: |
          docker build -f docker/Dockerfile.robotwin-slim \
            --build-arg "TORCH_CUDA_ARCH_LIST=7.0" \
            -t "${{ env.SWR_REG }}/vla-eval-robotwin:${{ inputs.tag }}" harness-build
          docker images | grep -E 'robotwin' || true
          docker push "${{ env.SWR_REG }}/vla-eval-robotwin:${{ inputs.tag }}"
