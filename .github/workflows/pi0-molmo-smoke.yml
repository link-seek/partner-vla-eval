name: pi0 MolmoSpaces Smoke

on:
  workflow_dispatch:
    inputs:
      smoke_episodes:
        description: "Smoke episodes (10 for quick check, 200 for full)"
        required: false
        default: "10"
      checkpoint:
        description: "LeRobot checkpoint"
        required: false
        default: "lerobot/pi05_libero_finetuned"

# 与 so101 共用同一台双32G V100，按官方要求串行，避免抢卡
concurrency:
  group: gpu-ecs-pi0-smoke
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline
  MOLMO_IMAGE: ghcr.io/allenai/vla-evaluation-harness/molmospaces:latest
  LIBERO_IMAGE: ghcr.io/allenai/vla-evaluation-harness/libero:latest

jobs:
  start-ecs:
    runs-on: [self-hosted, hw21]
    timeout-minutes: 15
    steps:
      - uses: Wandalen/wretry.action@v1
        with:
          attempt_limit: 3
          attempt_delay: 60000
          action: actions/checkout@v4
          with: |
            fetch-depth: 1
      - uses: ./.github/actions/ecs-power
        with:
          action: start
          server-id: ${{ env.ECS_SERVER_ID }}
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
  smoke:
    needs: start-ecs
    # 组织级 runner ecs-0002-org，标签含 V100-pi0，与 so101 彻底隔离
    runs-on: [self-hosted, Linux, X64, V100-pi0]
    timeout-minutes: 180
    steps:
      - name: Fetch payload (SWR, no github)
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          PAYLOAD_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/vla-payload:latest
        run: |
          set -e
          rm -rf scripts configs docker
          KEY=$(printf "${OBS_AK:?}" | openssl dgst -binary -sha256 -hmac "${OBS_SK:?}" | od -An -vtx1 | tr -d ' \n')
          echo "$KEY" | docker login -u "cn-north-4@${OBS_AK}" --password-stdin swr.cn-north-4.myhuaweicloud.com
          docker pull "$PAYLOAD_IMAGE"
          docker rm -f payload-tmp 2>/dev/null || true
          docker create --name payload-tmp "$PAYLOAD_IMAGE"
          docker cp payload-tmp:/payload/. .
          docker rm -f payload-tmp
          ls scripts/lib/common.sh configs/ docker/versions.yaml
      - name: Run smoke via Docker (host orchestration)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
        run: |
          mkdir -p results
          chmod +x scripts/ci_smoke.sh
          bash scripts/ci_smoke.sh 2>&1 | tee results/ci.log; CODE=${PIPESTATUS[0]}
          echo "smoke_exit=$CODE"
          exit $CODE
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi0-molmo-smoke
          path: results/
      - name: Upload to OBS
        if: always()
        run: |
          obsutil cp results/ obs://${{ env.OBS_BUCKET }}/eval/pi0-molmo-smoke/ -f -r -flat || true

  stop-ecs:
    needs: smoke
    runs-on: [self-hosted, hw21]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/ecs-power
        with:
          action: stop
          server-id: ${{ env.ECS_SERVER_ID }}
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
