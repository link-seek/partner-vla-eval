name: RobotWin Full (chunked)

# RobotWin 全量分块战役：50 task x N ep，按块跑，结果 OBS 按块累积。
# 单块建议 5 task x 50ep（约 2-4h @8 分片），10 块跑完。

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "块内 task（CogACT 一头一 task，一轮只打一个）"
        required: false
        default: "grab_roller"
      episodes:
        description: "每 task 集数"
        required: false
        default: "50"
      shards:
        description: "分片数"
        required: false
        default: "8"
      video:
        description: "1=录像，默认关"
        required: false
        default: "0"
      bench_tag:
        description: "benchmark 镜像 tag（0.8.0 含 expert_seeds+warp 修，已验证）"
        required: false
        default: "0.8.0"
      skip_expert:
        description: "true=盲种子，false=校验种子（0.8.0 默认）"
        required: false
        default: "false"
      volumes:
        description: "分号分隔的 -v 挂载（资产外置对照实验）"
        required: false
        default: ""
      serve_image:
        description: "serve 镜像（论文实验 B 用 fp32 版）"
        required: false
        default: "swr.cn-north-4.myhuaweicloud.com/link-seek/vla-serve-cogact:0.8.0"
      assets_mount:
        description: "资产外置挂载（host:container:ro），空=用镜像内置"
        required: false
        default: ""
      action_type:
        description: "空=不发（stock 镜像）；ee=EE 验证（需 ee 镜像）"
        required: false
        default: 
      serve_yaml:
        description: "serve 配置名（默认 CogACT 双臂；X-VLA 用 serve-robotwin.yaml）"
        required: false
        default: "serve-robotwin-cogact.yaml"
      prewarm:
        description: "cogact（默认，预热 Dexmal 权重）或 none（X-VLA 由 serve 自理）"
        required: false
        default: "cogact"
      serve_cuda:
        description: "serve 可见卡（默认 0；双卡分片用 0,1）"
        required: false
        default: "0"
      extra_mounts:
        description: "分号分隔的外层 -v（P2 补丁等），空=不用"
        required: false
        default: ""
      state_patch:
        description: "P2 终态补丁：空=不用（已退役，归档），robotwin=挂载本仓补丁"
        required: false
        default: ""
      run_yaml:
        description: "run 配置直用（对照实验，如 run-robotwin-xvla-easy50.yaml）；空=按 tasks 自动生成"
        required: false
        default: ""
      fast_init:
        description: "true（默认，跳 CuRobo 预热）或 false（EE 必需，IK 走 plan_path）"
        required: false
        default: "true"

      obs_prefix:
        description: "OBS 归档前缀，结果进 <前缀>/robotwin-full/（默认 obs://so101-sim-pipeline/eval；填错则开跑前拦截）"
        required: false
        default: "obs://so101-sim-pipeline/eval"
concurrency:
  group: gpu-ecs-pi0-smoke
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  ECS_SERVER_ID: c5b805bd-5e8d-4ba5-a5ab-7523244da0fa
  ECS_REGION: cn-north-4

jobs:
  start-ecs:
    runs-on: [self-hosted, hw21]
    timeout-minutes: 15
    steps:
      # 内联开机（不 checkout、不引用本地 action）：HW21 hcloud 现成，走华为云内网 API。
      # 背景：HW21 出境到 GitHub 被限速（~8KB/s），checkout 必超时；开关机本身零代码需求。
      - name: Power on V100 (inline, no checkout)
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          set -e
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          for i in $(seq 1 12); do
            sleep 60
            RAW=$(hcloud ECS ListServersDetails --cli-region="${{ env.ECS_REGION }}" --cli-access-key="${{ secrets.OBS_AK }}" --cli-secret-key="${{ secrets.OBS_SK }}" --limit=25 2>&1)
            ST=$(echo "$RAW" | python3 -c "import json,sys; d=json.load(sys.stdin); print([s['status'] for s in d['servers'] if s['id']=='${{ env.ECS_SERVER_ID }}'][0])" 2>/dev/null || echo UNKNOWN)
            echo "poll $i: $ST (want ACTIVE)"
            [ "$ST" = "ACTIVE" ] && { echo "power-verified: ACTIVE"; exit 0; }
          done
          echo "power-timeout: never reached ACTIVE" >&2
          exit 1
  chunk:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100-0001]
    # 自托管实际无 6h 限制；easy50 完整对照约 2~3 天，设 7 天（10080min）一次跑完
    timeout-minutes: 10080
    steps:
      - name: Validate OBS dest (fail fast, no GPU burn)
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_PREFIX: ${{ inputs.obs_prefix }}
          OBS_SUBDIR: robotwin-full
          OBS_ENDPOINT: https://obs.cn-north-4.myhuaweicloud.com
        run: |
          set -e
          case "${OBS_PREFIX:?}" in obs://*/*) ;; *) echo "obs_prefix 非法（形如 obs://<bucket>/<path>）：$OBS_PREFIX" >&2; exit 1;; esac
          DEST="${OBS_PREFIX%/}/${OBS_SUBDIR}/"
          echo "OBS_DEST=$DEST" >> "$GITHUB_ENV"
          echo "validating OBS dest: $DEST"
          echo vla-eval-write-probe > /tmp/obs-probe
          PROBE="${DEST}.vla-eval-write-probe"
          obsutil cp /tmp/obs-probe "$PROBE" -f -e "$OBS_ENDPOINT" -i "$OBS_AK" -k "$OBS_SK" \
            || { echo "OBS 不可写，停止（不烧卡）：$DEST" >&2; exit 1; }
          obsutil rm "$PROBE" -f -e "$OBS_ENDPOINT" -i "$OBS_AK" -k "$OBS_SK" || true
          echo "obs-ok: $DEST"
      - name: Fetch payload (SWR, no github)
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          PAYLOAD_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/vla-payload:latest
        run: |
          set -e
          rm -rf scripts configs docker
          KEY=$(printf "${OBS_AK:?}" | openssl dgst -binary -sha256 -hmac "${OBS_SK:?}" | od -An -vtx1 | tr -d ' \n')
          echo "$KEY" | docker login -u "cn-north-4@${OBS_AK}" --password-stdin swr.cn-north-4.myhuaweicloud.com
          docker pull "$PAYLOAD_IMAGE"
          docker rm -f payload-tmp 2>/dev/null || true
          docker create --name payload-tmp "$PAYLOAD_IMAGE"
          docker cp payload-tmp:/payload/. .
          docker rm -f payload-tmp
          ls scripts/lib/common.sh configs/ docker/versions.yaml
      - name: Run RobotWin chunk
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          RW_TASKS: ${{ inputs.tasks }}
          RW_EPISODES: ${{ inputs.episodes }}
          RW_SHARDS: ${{ inputs.shards }}
          RW_VIDEO: ${{ inputs.video }}
          RW_BENCH_TAG: ${{ inputs.bench_tag }}
          RW_SKIP_EXPERT: ${{ inputs.skip_expert }}
          RW_ACTION_TYPE: ${{ inputs.action_type }}
          RW_SERVE_YAML: ${{ inputs.serve_yaml }}
          RW_PREWARM: ${{ inputs.prewarm }}
          RW_FAST_INIT: ${{ inputs.fast_init }}
          RW_VOLUMES: ${{ inputs.volumes }}
          SERVE_IMAGE: ${{ inputs.serve_image }}
          SERVE_CUDA: ${{ inputs.serve_cuda }}
          ASSETS_MOUNT: ${{ inputs.assets_mount }}
          RW_EXTRA_MOUNTS: ${{ inputs.extra_mounts }}
          RW_STATE_PATCH: ${{ inputs.state_patch }}
          RW_RUN_YAML: ${{ inputs.run_yaml }}
        run: |
          mkdir -p results
          chmod +x scripts/ci_robotwin_full.sh
          bash scripts/ci_robotwin_full.sh 2>&1 | tee results/ci.log; CODE=${PIPESTATUS[0]}
          echo "chunk_exit=$CODE"
          exit $CODE
      - name: Upload to OBS
        if: always()
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_ENDPOINT: https://obs.cn-north-4.myhuaweicloud.com
        run: |
          obsutil cp results/ "${OBS_DEST:?}" -f -r -flat -e "$OBS_ENDPOINT" -i "$OBS_AK" -k "$OBS_SK" || true

  stop-ecs:
    needs: chunk
    runs-on: [self-hosted, hw21]
    if: always()
    timeout-minutes: 15
    steps:
      # 内联关机（不 checkout；关机前拉代码无意义，且本地 action 引用依赖缓存）
      - name: Power off V100 (inline, no checkout)
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          set -e
          sleep 120
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          for i in $(seq 1 12); do
            sleep 60
            RAW=$(hcloud ECS ListServersDetails --cli-region="${{ env.ECS_REGION }}" --cli-access-key="${{ secrets.OBS_AK }}" --cli-secret-key="${{ secrets.OBS_SK }}" --limit=25 2>&1)
            ST=$(echo "$RAW" | python3 -c "import json,sys; d=json.load(sys.stdin); print([s['status'] for s in d['servers'] if s['id']=='${{ env.ECS_SERVER_ID }}'][0])" 2>/dev/null || echo UNKNOWN)
            echo "poll $i: $ST (want SHUTOFF)"
            [ "$ST" = "SHUTOFF" ] && { echo "power-verified: SHUTOFF"; exit 0; }
          done
          echo "power-timeout: never reached SHUTOFF" >&2
          exit 1
