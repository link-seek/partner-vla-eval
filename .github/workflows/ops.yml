name: ops

# 常驻运维入口（登记为 rare）：原先 4 个一次性 workflow 收敛到这里。
# 规则见 CONTRIBUTING 第二/三节：main 只放常驻能力；一次性动作开分支做完即删。
#
# 每个 action 对应的手工等价步骤见 docs/howto/：
#   repair-0001 / repair-0002 → docs/howto/repair-runner.md
#   tailnet-join              → docs/howto/tailnet-join.md
#   audit                     → 只读审计（du / docker images / nvidia-smi）
#
# runner 选择（2026-11-25 实测后确定）：
#   audit        → V100-0002（本机只读；也可 V100-0001）
#   repair-0001  → V100-0002（到 0001 的 22 通）
#   repair-0002  → V100-0001（**不能**在 0002 自己身上重配 agent，会把自己踢下线）
#   tailnet-join → 需要一个在 tailnet 上的 runner（hw41/hw21）。当前无在线节点 = 已知缺口。
on:
  workflow_dispatch:
    inputs:
      action:
        description: "要执行的动作"
        required: true
        type: choice
        options:
          - audit
          - repair-0002
          - repair-0001
          - tailnet-join
      hostname:
        description: "tailnet-join 用：V100 在 tailnet 里的主机名"
        required: false
        default: "v100-0002"
      runner:
        description: "在哪个 self-hosted runner 上执行（标签）。默认 V100-0002；repair-0002 必须换成 V100-0001（不能在目标机自己身上重配 agent）"
        required: false
        default: "V100-0002"

permissions:
  contents: read

concurrency:
  group: ops-${{ inputs.action }}
  cancel-in-progress: false

jobs:
  run:
    # 2026-11-25 实测：原 hw21 runner 已不在线（组织级只剩 ecs-0002，仓级只剩 ecs-0001）。
    # 所以 runner 改成输入参数，默认 V100-0002；约束见 docs/howto/repair-runner.md。
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ops action
        env:
          ACTION: ${{ inputs.action }}
          TAILNET_HOSTNAME: ${{ inputs.hostname }}
          V100_SSH_PASS: ${{ secrets.V100_SSH_PASS }}
          V100_REG_TOKEN: ${{ secrets.V100_REG_TOKEN }}
          PROD_GH_TOKEN: ${{ secrets.PROD_GH_TOKEN }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          PROD_HCLOUD_AK: ${{ secrets.PROD_HCLOUD_AK }}
          PROD_HCLOUD_SK: ${{ secrets.PROD_HCLOUD_SK }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: bash scripts/ops/run.sh
