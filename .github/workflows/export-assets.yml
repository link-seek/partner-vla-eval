name: Export RoboTwin Assets

# 资产外置 Phase 1：免费机 clone RoboTwin 同 ref，下资产zip，解包校验，
# 打包传 OBS（版本目录 = ROBOTWIN_REF）。V100 从 OBS 内网拖，不碰外网。

on:
  workflow_dispatch:
    inputs:
      robotwin_ref:
        description: "RoboTwin commit（跟 benchmark 镜像一致）"
        required: false
        default: "c3ddfa8b97d5519efa828b075999bd0006778e5e"

permissions:
  contents: read

env:
  OBS_BUCKET: so101-sim-pipeline
  OBS_ENDPOINT: https://so101-sim-pipeline.obs.cn-north-4.myhuaweicloud.com

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Clone RoboTwin + download assets
        run: |
          python3 -m pip install -q "huggingface_hub" 2>&1 | tail -n 1
          rm -rf RoboTwin && git init -q RoboTwin && cd RoboTwin
          git remote add origin https://github.com/RoboTwin-Platform/RoboTwin.git
          git fetch -q --depth 1 origin "${{ inputs.robotwin_ref }}"
          git checkout -q FETCH_HEAD
          cd assets && python3 _download.py
          ls -la
      - name: Unzip + manifest
        run: |
          cd RoboTwin/assets
          for z in objects.zip embodiments.zip background_texture.zip; do unzip -qo "$z" && rm -f "$z"; done
          ls
          find objects embodiments background_texture files -type f | sort > /tmp/asset-list.txt; wc -l /tmp/asset-list.txt
          tar -cf /tmp/robotwin-assets.tar objects embodiments background_texture files
          ls -lh /tmp/robotwin-assets.tar
      - name: Upload to OBS (obsutil)
        run: |
          curl -sSL -o /tmp/obsutil.tgz https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz
          tar -xzf /tmp/obsutil.tgz -C /tmp
          /tmp/obsutil_linux_amd64_*/obsutil cp /tmp/robotwin-assets.tar obs://so101-sim-pipeline/assets/robotwin/${{ inputs.robotwin_ref }}/assets.tar -e https://obs.cn-north-4.myhuaweicloud.com -i "${{ secrets.OBS_AK }}" -k "${{ secrets.OBS_SK }}" -f -r
          /tmp/obsutil_linux_amd64_*/obsutil cp /tmp/asset-list.txt obs://so101-sim-pipeline/assets/robotwin/${{ inputs.robotwin_ref }}/manifest.txt -e https://obs.cn-north-4.myhuaweicloud.com -i "${{ secrets.OBS_AK }}" -k "${{ secrets.OBS_SK }}" -f
