name: Build Serve Images

# 外网构建活：免费机打 serve 镜像→SWR。V100 只从 SWR 内网拉，零构建。
#
# 权重不同步到 OBS：15GB 级跨洋上传太慢（实测 60KB/s），权重走 mirror+token 直下 V100（已验证通）。
# V100 上的“下载”只剩 mirror/SWR/OBS 内网 endpoint，符合内网机要求。

on:
  workflow_dispatch:
    inputs:
      images:
        description: "逗号分隔：serve-cogact,serve-xvla（默认全量，xvla Dockerfile 待补先跳过）"
        required: false
        default: "serve-cogact"

permissions:
  contents: read

env:
  SWR_REG: swr.cn-north-4.myhuaweicloud.com/link-seek

jobs:
  build-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: [serve-cogact]
    steps:
      - uses: actions/checkout@v4
      - name: Filter
        id: gate
        run: |
          if echo ",${{ inputs.images }}," | grep -q ",${{ matrix.image }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login SWR (HMAC)
        if: steps.gate.outputs.run == 'true'
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          echo "$LOGIN_KEY" | docker login -u "cn-north-4@${{ secrets.OBS_AK }}" --password-stdin swr.cn-north-4.myhuaweicloud.com
      - name: Build + push
        if: steps.gate.outputs.run == 'true'
        run: |
          case "${{ matrix.image }}" in
            serve-cogact) DOCKERFILE=docker/Dockerfile.serve-cogact; TAG=vla-serve-cogact:0.7.0 ;;
          esac
          docker build -f "$DOCKERFILE" -t "${{ env.SWR_REG }}/$TAG" .
          docker push "${{ env.SWR_REG }}/$TAG"
