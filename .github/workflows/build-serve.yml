name: Build Serve Images

# 外网构建活：免费机打 serve 镜像→SWR。V100 只从 SWR 内网拉，零构建。
#
# 权重不同步到 OBS：15GB 级跨洋上传太慢（实测 60KB/s），权重走 mirror+token 直下 V100（已验证通）。
# V100 上的“下载”只剩 mirror/SWR/OBS 内网 endpoint，符合内网机要求。

on:
  workflow_dispatch:
    inputs:
      force_retag:
        description: "版本 tag 已存在且 digest 不同时强行挪 tag（旧 pin 会断；默认红）"
        required: false
        type: boolean
        default: false
      images:
        description: "逗号分隔：serve-cogact,serve-cogact-fp32,serve-pi05,serve-xvla,serve-xvla-fp16,serve-smolvla,serve-pi0,verify,serve-robotwin-act,serve-robotwin-dp"
        required: false
        default: "serve-cogact,serve-pi05,serve-xvla,serve-smolvla,serve-pi0,serve-cogact-fp32-2gpu,verify,serve-robotwin-act,serve-robotwin-dp"

permissions:
  contents: read

env:
  SWR_REG: swr.cn-north-4.myhuaweicloud.com/link-seek

jobs:
  build-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: [serve-cogact, serve-cogact-fp32, serve-pi05, serve-xvla, serve-xvla-fp16, serve-smolvla, serve-pi0, serve-cogact-fp32-2gpu, verify, serve-robotwin-act, serve-robotwin-dp]
    steps:
      - uses: actions/checkout@v4
      - name: Filter
        id: gate
        run: |
          if echo ",${{ inputs.images }}," | grep -q ",${{ matrix.image }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login SWR (HMAC)
        if: steps.gate.outputs.run == 'true'
        run: |
          LOGIN_KEY=$(printf "${{ secrets.PROD_HCLOUD_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.PROD_HCLOUD_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          echo "$LOGIN_KEY" | docker login -u "cn-north-4@${{ secrets.PROD_HCLOUD_AK }}" --password-stdin swr.cn-north-4.myhuaweicloud.com
      - name: Build + push
        if: steps.gate.outputs.run == 'true'
        run: |
          case "${{ matrix.image }}" in
            serve-cogact) DOCKERFILE=docker/Dockerfile.serve-cogact; TAG=vla-serve-cogact:0.8.0; BUILD_ARGS="" ;;
            serve-cogact-fp32) DOCKERFILE=docker/Dockerfile.serve-cogact; TAG=vla-serve-cogact-fp32:0.8.0; BUILD_ARGS="--build-arg DTYPE=torch.float32" ;;
            serve-cogact-fp32-2gpu) DOCKERFILE=docker/Dockerfile.serve-cogact; TAG=vla-serve-cogact-fp32-2gpu:0.8.0; BUILD_ARGS="--build-arg DTYPE=torch.float32 --build-arg DEVICE_MAP=auto" ;;
            serve-pi05) DOCKERFILE=docker/Dockerfile.serve-pi05; TAG=vla-serve-pi05:0.8.0; BUILD_ARGS="" ;;
            serve-xvla) DOCKERFILE=docker/Dockerfile.serve-xvla; TAG=vla-serve-xvla:0.8.0-ee16; BUILD_ARGS="" ;;
            serve-xvla-fp16) DOCKERFILE=docker/Dockerfile.serve-xvla; TAG=vla-serve-xvla-fp16:0.8.0; BUILD_ARGS="--build-arg DTYPE=torch.float16" ;;
            serve-smolvla) DOCKERFILE=docker/Dockerfile.serve-smolvla; TAG=vla-serve-smolvla:0.8.0; BUILD_ARGS="" ;;
            serve-pi0) DOCKERFILE=docker/Dockerfile.serve-pi0; TAG=vla-serve-pi0:0.8.0; BUILD_ARGS="" ;;
            verify) DOCKERFILE=docker/Dockerfile.verify; TAG=vla-verify:0.1; BUILD_ARGS="" ;;
            serve-robotwin-act) DOCKERFILE=docker/Dockerfile.serve-robotwin; TAG=vla-serve-robotwin-act:0.8.0; BUILD_ARGS="--build-arg POLICY=act" ;;
            serve-robotwin-dp) DOCKERFILE=docker/Dockerfile.serve-robotwin; TAG=vla-serve-robotwin-dp:0.8.0; BUILD_ARGS="--build-arg POLICY=dp" ;;
          esac
          set -euo pipefail
          REF="${{ env.SWR_REG }}/$TAG"
          TEMP="${REF}-ci${{ github.run_id }}"
          # shellcheck disable=SC2086
          docker build -f "$DOCKERFILE" $BUILD_ARGS -t "$TEMP" .
          docker push "$TEMP"
          NEW_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$TEMP")
          echo "本次 digest: $NEW_DIGEST"

          # 版本 tag 不可变守卫（house 约定，见 link-seek/docker-images bake-stack.yml）：
          # tag 已被别的 digest 占着就红，除非显式 force_retag —— 否则下游 pin 会被静默挪走。
          EXISTING=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$REF" 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "$NEW_DIGEST" ]; then
            if [ "${{ inputs.force_retag }}" = "true" ]; then
              echo "::warning::tag $TAG 已存在($EXISTING)，force_retag 挪到 $NEW_DIGEST；旧 pin 会断"
            else
              echo "::error::版本 tag $TAG 已存在且指向 $EXISTING ≠ 本次 $NEW_DIGEST；版本 tag 不可变。请发新版本或显式 force_retag=true"
              exit 1
            fi
          fi

          # 转正：registry 侧改 tag（不重传层）；跨境偶发断流重试 3 次
          for i in 1 2 3; do
            docker buildx imagetools create -t "$REF" "$TEMP" && break || {
              echo "转正 $TAG 第 $i 次失败"; sleep 60; }
            [ "$i" -lt 3 ] || { echo "::error::转正 $TAG 三次全失败"; exit 1; }
          done
          echo "**$TAG** → $NEW_DIGEST" >> "$GITHUB_STEP_SUMMARY"
