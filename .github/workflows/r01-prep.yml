name: R01 Data Prep (RoboTwin 2.0 subset)

# S1：把 R01 要用的训练数据取到 V100 本地盘（5 task × clean_50 + randomized_500）。
# 只在自托管机上跑，产物留盘不传 OBS（manifest 上传留痕）；跑完照常关机。
# 幂等：已下好的 zip 跳过，缺的补下；可重复 dispatch。

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "任务列表（逗号分隔）"
        required: false
        default: "grab_roller,adjust_bottle,place_phone_stand,click_bell,handover_block"
      data_root:
        description: "本地落盘目录（跟随机器持久盘）"
        required: false
        default: "/root/robotwin-train"

concurrency:
  group: gpu-ecs-0002-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  start-ecs:
    uses: ./.github/workflows/power.yml
    with:
      action: start
      server-id: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
    secrets:
      HCLOUD_AK: ${{ secrets.PROD_HCLOUD_AK }}
      HCLOUD_SK: ${{ secrets.PROD_HCLOUD_SK }}

  prep:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100-0002]
    timeout-minutes: 240
    steps:
      - name: Fetch payload (SWR, no github)
        env:
          OBS_AK: ${{ secrets.PROD_HCLOUD_AK }}
          OBS_SK: ${{ secrets.PROD_HCLOUD_SK }}
          PAYLOAD_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/vla-payload:latest
        run: |
          set -e
          rm -rf scripts configs docker
          KEY=$(printf "${OBS_AK:?}" | openssl dgst -binary -sha256 -hmac "${OBS_SK:?}" | od -An -vtx1 | tr -d ' \n')
          echo "$KEY" | docker login -u "cn-north-4@${OBS_AK}" --password-stdin swr.cn-north-4.myhuaweicloud.com
          docker pull "$PAYLOAD_IMAGE"
          docker rm -f payload-tmp 2>/dev/null || true
          docker create --name payload-tmp "$PAYLOAD_IMAGE"
          docker cp payload-tmp:/payload/. .
          docker rm -f payload-tmp
          ls scripts/prepare_robotwin_data.sh
      - name: Download + unpack + manifest
        env:
          TASKS: ${{ inputs.tasks }}
          DATA_ROOT: ${{ inputs.data_root }}
        run: |
          df -h / | tail -1
          bash scripts/prepare_robotwin_data.sh 2>&1 | tail -60
          echo "--- manifest ---"
          cat "$DATA_ROOT/manifest.json"
      - name: Upload manifest to OBS (trace)
        env:
          OBS_AK: ${{ secrets.PROD_HCLOUD_AK }}
          OBS_SK: ${{ secrets.PROD_HCLOUD_SK }}
          DATA_ROOT: ${{ inputs.data_root }}
        run: |
          obsutil cp "$DATA_ROOT/manifest.json" "obs://so101-sim-pipeline/eval/r01-data/manifest.json" \
            -f -e https://obs.cn-north-4.myhuaweicloud.com -i "$OBS_AK" -k "$OBS_SK" || true

  stop-ecs:
    needs: prep
    if: always()
    uses: ./.github/workflows/power.yml
    with:
      action: stop
      server-id: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
    secrets:
      HCLOUD_AK: ${{ secrets.PROD_HCLOUD_AK }}
      HCLOUD_SK: ${{ secrets.PROD_HCLOUD_SK }}
