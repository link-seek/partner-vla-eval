name: Probe JEV Judge

# JEV 裁判探针：state + questions 进，typed 判决出。OPENCODE_API_KEY 只活在 runner 侧，
# 日志只打 JEV 的回答，不打 key。

on:
  workflow_dispatch:
    inputs:
      state:
        description: "仿真器结构化 state（JSON 字符串）"
        required: false
        default: '{"task":"pick up the black bowl","gripper_open":true,"candidates":["A","B"]}'
      questions:
        description: "JEV questions（JSON 字符串）"
        required: false
        default: '{"pick_best":{"type":"choice","instructions":"Which candidate is more likely to succeed?","criteria":{"A":"Move toward the bowl","B":"Move away from the bowl"}}}'
      model:
        description: "jev-1.13-free 或 jev-1.13"
        required: false
        default: "jev-1.13-free"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask JEV (key masked by Actions, only the answer is logged)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_JEV }}
        run: |
          python3 - "$OPENCODE_API_KEY" <<'EOF'
          import json, sys, urllib.request
          key = sys.argv[1]
          for url in ["https://opencode.ai/inference/v1/models"]:
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + key})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      d = json.load(r)
                      ms = [m.get("id", m) for m in (d if isinstance(d, list) else d.get("data", []))]
                      jev = [m for m in ms if "jev" in str(m).lower()]
                      print("MODELS_TOTAL:", len(ms), "JEV_ENTRIES:", jev if jev else "NONE")
              except Exception as e:
                  print(url, "CALL_FAILED:", str(e)[:300])
          EOF
      - name: Ask JEV systemone (same key)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_JEV }}
        run: |
          python3 - "$OPENCODE_API_KEY" '${{ inputs.model }}' '${{ inputs.state }}' '${{ inputs.questions }}' <<'PYEOF2'
          import json, sys, urllib.request
          key, model, state, questions = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          body = json.dumps({"model": model, "state": state, "questions": json.loads(questions)}).encode()
          req = urllib.request.Request("https://opencode.ai/inference/systemone/v1/systemone", data=body, headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  print(r.read().decode()[:3000])
          except Exception as e:
              print("CALL_FAILED:", str(e)[:500])
          PYEOF2
