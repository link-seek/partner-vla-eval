name: Probe JEV Judge

# JEV 裁判探针：state + questions 进，typed 判决出。OPENCODE_API_KEY 只活在 runner 侧，
# 日志只打 JEV 的回答，不打 key。
# 注意：opencode.ai 前面是 Cloudflare，会按 UA 签名封禁 Python-urllib（403 / error code 1010）。
# 任何 200 侧 UA（requests 默认、curl、浏览器 UA、自定义 UA 均已验证）都行，urllib 需显式覆盖 UA。

on:
  workflow_dispatch:
    inputs:
      state:
        description: "仿真器结构化 state（JSON 字符串）"
        required: false
        default: '{"task":"pick up the black bowl","gripper_open":true,"candidates":["A","B"]}'
      questions:
        description: "JEV questions（JSON 字符串）"
        required: false
        default: '{"pick_best":{"type":"choice","instructions":"Which candidate is more likely to succeed?","criteria":{"A":"Move toward the bowl","B":"Move away from the bowl"}}}'
      model:
        description: "jev-1.13-free 或 jev-1.13"
        required: false
        default: "jev-1.13-free"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (wretry 包裹，V100 同款写法金丝雀)
        uses: Wandalen/wretry.action@v1
        with:
          attempt_limit: 3
          attempt_delay: 15000
          action: actions/checkout@v4
          with: |
            fetch-depth: 1
      - name: Ask JEV, no-auth first (issue #4 pattern), key fallback
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python3 - '${{ inputs.model }}' '${{ inputs.state }}' '${{ inputs.questions }}' "$OPENCODE_API_KEY" <<'EOF'
          import json, sys, urllib.request
          model, state, questions, key = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          # CF error 1010: urllib 的默认 UA 被 opencode.ai 的 Cloudflare WAF 封禁，必须覆盖
          UA = "partner-vla-eval-probe/1.0"
          def call(headers):
              body = json.dumps({"model": model, "state": state, "questions": json.loads(questions)}).encode()
              req = urllib.request.Request("https://opencode.ai/inference/systemone/v1/systemone", data=body, headers=dict({"Content-Type": "application/json", "User-Agent": UA}, **headers))
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read().decode()[:3000]
          try:
              print("NOAUTH:", call({}))
          except Exception as e:
              print("NOAUTH_FAILED:", str(e)[:300])
              try:
                  print("WITHKEY:", call({"Authorization": "Bearer " + key}))
              except Exception as e2:
                  print("KEY_FAILED:", str(e2)[:300])
          EOF
