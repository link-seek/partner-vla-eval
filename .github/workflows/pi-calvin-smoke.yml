name: CALVIN Smoke (DB-CogACT)

# CALVIN 单臂长程 smoke：5 sequences，只验链路。

on:
  workflow_dispatch:
    inputs:
      bench_image:
        description: "benchmark 镜像（0.8.0 已同步到 SWR）"
        required: false
        default: "swr.cn-north-4.myhuaweicloud.com/link-seek/vla-eval-calvin:0.8.0"
      serve_image:
        description: "serve 镜像（fp32 双卡对照用 serve-cogact-fp32-2gpu）"
        required: false
        default: "swr.cn-north-4.myhuaweicloud.com/link-seek/vla-serve-cogact:0.8.0"
      serve_cuda:
        description: "serve 可见卡（默认 0；fp32 分片用 0,1）"
        required: false
        default: "0"

      obs_prefix:
        description: "OBS 归档前缀，结果进 <前缀>/calvin-smoke/（默认 obs://so101-sim-pipeline/eval；填错则开跑前拦截）"
        required: false
        default: "obs://so101-sim-pipeline/eval"
concurrency:
  group: gpu-ecs-0002-smoke
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  start-ecs:
    uses: ./.github/workflows/power.yml
    with:
      action: start
      server-id: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
    secrets:
      HCLOUD_AK: ${{ secrets.PROD_HCLOUD_AK }}
      HCLOUD_SK: ${{ secrets.PROD_HCLOUD_SK }}
  smoke:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100-0002]
    timeout-minutes: 180
    steps:
      - name: Validate OBS dest (fail fast, no GPU burn)
        env:
          OBS_AK: ${{ secrets.PROD_HCLOUD_AK }}
          OBS_SK: ${{ secrets.PROD_HCLOUD_SK }}
          OBS_PREFIX: ${{ inputs.obs_prefix }}
          OBS_SUBDIR: calvin-smoke
          OBS_ENDPOINT: https://obs.cn-north-4.myhuaweicloud.com
        run: |
          set -e
          case "${OBS_PREFIX:?}" in obs://*/*) ;; *) echo "obs_prefix 非法（形如 obs://<bucket>/<path>）：$OBS_PREFIX" >&2; exit 1;; esac
          DEST="${OBS_PREFIX%/}/${OBS_SUBDIR}/"
          echo "OBS_DEST=$DEST" >> "$GITHUB_ENV"
          echo "validating OBS dest: $DEST"
          echo vla-eval-write-probe > /tmp/obs-probe
          PROBE="${DEST}.vla-eval-write-probe"
          obsutil cp /tmp/obs-probe "$PROBE" -f -e "$OBS_ENDPOINT" -i "$OBS_AK" -k "$OBS_SK" \
            || { echo "OBS 不可写，停止（不烧卡）：$DEST" >&2; exit 1; }
          obsutil rm "$PROBE" -f -e "$OBS_ENDPOINT" -i "$OBS_AK" -k "$OBS_SK" || true
          echo "obs-ok: $DEST"
      - name: Fetch payload (SWR, no github)
        env:
          OBS_AK: ${{ secrets.PROD_HCLOUD_AK }}
          OBS_SK: ${{ secrets.PROD_HCLOUD_SK }}
          PAYLOAD_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/vla-payload:latest
        run: |
          set -e
          rm -rf scripts configs docker
          KEY=$(printf "${OBS_AK:?}" | openssl dgst -binary -sha256 -hmac "${OBS_SK:?}" | od -An -vtx1 | tr -d ' \n')
          echo "$KEY" | docker login -u "cn-north-4@${OBS_AK}" --password-stdin swr.cn-north-4.myhuaweicloud.com
          docker pull "$PAYLOAD_IMAGE"
          docker rm -f payload-tmp 2>/dev/null || true
          docker create --name payload-tmp "$PAYLOAD_IMAGE"
          docker cp payload-tmp:/payload/. .
          docker rm -f payload-tmp
          ls scripts/ci/lib/common.sh configs/ docker/versions.yaml
      - name: Run CALVIN smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBS_AK: ${{ secrets.PROD_HCLOUD_AK }}
          OBS_SK: ${{ secrets.PROD_HCLOUD_SK }}
          CALVIN_IMAGE: ${{ inputs.bench_image }}
          SERVE_IMAGE: ${{ inputs.serve_image }}
          SERVE_CUDA: ${{ inputs.serve_cuda }}
        run: |
          mkdir -p results
          chmod +x scripts/ci/ci_calvin.sh
          bash scripts/ci/ci_calvin.sh 2>&1 | tee results/ci.log; CODE=${PIPESTATUS[0]}
          echo "smoke_exit=$CODE"
          exit $CODE
      - name: Upload to OBS
        if: always()
        env:
          OBS_AK: ${{ secrets.PROD_HCLOUD_AK }}
          OBS_SK: ${{ secrets.PROD_HCLOUD_SK }}
          OBS_ENDPOINT: https://obs.cn-north-4.myhuaweicloud.com
        run: |
          set -e
          obsutil cp results/ "${OBS_DEST:?}" -f -r -e "$OBS_ENDPOINT" -i "$OBS_AK" -k "$OBS_SK"
          # C6 回读校验：以前 `|| true` 会吞掉上传失败，产物只在机器上、OBS 空着也没人知道
          CNT=$(obsutil ls "${OBS_DEST}" -e "$OBS_ENDPOINT" -i "$OBS_AK" -k "$OBS_SK" 2>/dev/null | grep -c 'obs://' || true)
          echo "OBS 回读对象数: $CNT"
          if [ "${CNT:-0}" -lt 1 ]; then echo "REFUSE: OBS 回读为空，上传实际失败: ${OBS_DEST}" >&2; exit 1; fi
  stop-ecs:
    needs: smoke
    if: always()
    uses: ./.github/workflows/power.yml
    with:
      action: stop
      server-id: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
    secrets:
      HCLOUD_AK: ${{ secrets.PROD_HCLOUD_AK }}
      HCLOUD_SK: ${{ secrets.PROD_HCLOUD_SK }}
