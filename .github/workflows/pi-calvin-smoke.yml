name: CALVIN Smoke (DB-CogACT)

# CALVIN 单臂长程 smoke：5 sequences，只验链路。

on:
  workflow_dispatch:
    inputs:
      bench_image:
        description: "benchmark 镜像（0.8.0 已同步到 SWR）"
        required: false
        default: "swr.cn-north-4.myhuaweicloud.com/link-seek/vla-eval-calvin:0.8.0"
      serve_image:
        description: "serve 镜像（fp32 双卡对照用 serve-cogact-fp32-2gpu）"
        required: false
        default: "swr.cn-north-4.myhuaweicloud.com/link-seek/vla-serve-cogact:0.7.0"
      serve_cuda:
        description: "serve 可见卡（默认 0；fp32 分片用 0,1）"
        required: false
        default: "0"

concurrency:
  group: gpu-ecs-pi0-smoke
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: [self-hosted, hw21]
    timeout-minutes: 15
    steps:
      - uses: Wandalen/wretry.action@v1
        with:
          attempt_limit: 3
          attempt_delay: 60000
          action: actions/checkout@v4
          with: |
            fetch-depth: 1
      - uses: ./.github/actions/ecs-power
        with:
          action: start
          server-id: ${{ env.ECS_SERVER_ID }}
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
  smoke:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100-pi0]
    timeout-minutes: 180
    steps:
      - uses: Wandalen/wretry.action@v1
        with:
          attempt_limit: 3
          attempt_delay: 60000
          action: actions/checkout@v4
          with: |
            clean: false
      - name: Run CALVIN smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          CALVIN_IMAGE: ${{ inputs.bench_image }}
          SERVE_IMAGE: ${{ inputs.serve_image }}
          SERVE_CUDA: ${{ inputs.serve_cuda }}
        run: |
          mkdir -p results
          chmod +x scripts/ci_calvin.sh
          bash scripts/ci_calvin.sh 2>&1 | tee results/ci.log; CODE=${PIPESTATUS[0]}
          echo "smoke_exit=$CODE"
          exit $CODE
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calvin-smoke
          path: results/
      - name: Upload to OBS
        if: always()
        run: |
          obsutil cp results/ obs://${{ env.OBS_BUCKET }}/eval/calvin-smoke/ -f -r -flat || true

  stop-ecs:
    needs: smoke
    runs-on: [self-hosted, hw21]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/ecs-power
        with:
          action: stop
          server-id: ${{ env.ECS_SERVER_ID }}
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
