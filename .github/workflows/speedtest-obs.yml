name: OBS Speed Test (scratch, delete after)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OBS_AK }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SK }}
    steps:
      - name: Make 100MB test file
        run: head -c 100M /dev/urandom > /tmp/blob100m
      - name: awscli upload
        run: |
          time aws --endpoint-url https://so101-sim-pipeline.obs.cn-north-4.myhuaweicloud.com s3 cp /tmp/blob100m s3://speedtest/blob100m-aws 2>&1 | tail -n 3
      - name: obsutil upload
        run: |
          curl -sSL -o /tmp/obsutil.tgz https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz
          tar -xzf /tmp/obsutil.tgz -C /tmp && ls /tmp/obsutil*/obsutil
          time /tmp/obsutil*/obsutil cp /tmp/blob100m obs://so101-sim-pipeline/speedtest/blob100m-obsutil -e=https://obs.cn-north-4.myhuaweicloud.com -ak="${{ secrets.OBS_AK }}" -sk="${{ secrets.OBS_SK }}" 2>&1 | tail -n 5
      - name: Cleanup bucket test files
        if: always()
        run: |
          aws --endpoint-url https://so101-sim-pipeline.obs.cn-north-4.myhuaweicloud.com s3 rm s3://speedtest/blob100m-aws 2>/dev/null || true
          /tmp/obsutil*/obsutil rm obs://so101-sim-pipeline/speedtest/blob100m-obsutil -e=https://obs.cn-north-4.myhuaweicloud.com -ak="${{ secrets.OBS_AK }}" -sk="${{ secrets.OBS_SK }}" -f 2>/dev/null || true
