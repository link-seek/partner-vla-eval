name: Build Benchmark EE

# 外网构建活：免费机打 robotwin-ee（0.8.0 + PR#168 等价补丁）→ SWR。
# 与 GPU 队列完全并行（不同 runner）。上下文就是本仓（patch 在 docker/ 内）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SWR tag"
        required: false
        default: "ee-0.8.0"

permissions:
  contents: read

env:
  SWR_REG: swr.cn-north-4.myhuaweicloud.com/link-seek

jobs:
  build-ee:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (conservative)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h / | tail -n 1
      - name: Login SWR (HMAC)
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          echo "$LOGIN_KEY" | docker login -u "cn-north-4@${{ secrets.OBS_AK }}" --password-stdin swr.cn-north-4.myhuaweicloud.com
      - name: Build + push robotwin-ee
        run: |
          docker build -f docker/Dockerfile.robotwin-ee \
            -t "${{ env.SWR_REG }}/vla-eval-robotwin:${{ inputs.tag }}" .
          docker images | grep -E 'robotwin' || true
          docker push "${{ env.SWR_REG }}/vla-eval-robotwin:${{ inputs.tag }}"
