name: Debug 0001 prewarm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: [self-hosted, Linux, X64, V100-0001]
    timeout-minutes: 20
    steps:
      - name: Disk audit (read-only)
        run: |
          echo "=== inspect ==="; docker image inspect dreamidv:latest --format '{{.Id}} created={{.Created}} entrypoint={{.Config.Entrypoint}} cmd={{.Config.Cmd}} workdir={{.Config.WorkingDir}}' 2>&1 | head -3
          echo "=== labels/env ==="; docker image inspect dreamidv:latest --format '{{.Config.Labels}}' 2>&1 | head -3; docker image inspect dreamidv:latest --format '{{.Config.Env}}' 2>&1 | head -c 600; echo
          echo "=== history ==="; docker history dreamidv:latest --no-trunc 2>&1 | head -12 | cut -c1-200
          echo "=== /data/dreamidv ==="; ls /data/dreamidv 2>/dev/null | head -10; du -sh /data/dreamidv 2>/dev/null
