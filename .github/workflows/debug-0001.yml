name: Debug 0001 prewarm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: [self-hosted, Linux, X64, V100-0001]
    timeout-minutes: 20
    steps:
      - name: Disk audit (read-only)
        run: |
          echo "=== c3ddfa8 layout ==="; ls /data/robotwin-assets/c3ddfa8/ 2>&1; du -sh /data/robotwin-assets/c3ddfa8/* 2>/dev/null | head -8
          echo "=== writability ==="; touch /data/robotwin-assets/c3ddfa8/.wtest 2>&1 && { echo WRITABLE; rm -f /data/robotwin-assets/c3ddfa8/.wtest; } || echo "READ-ONLY(for runner)"
          echo "=== ls -la ==="; ls -ld /data/robotwin-assets /data/robotwin-assets/c3ddfa8 2>&1
