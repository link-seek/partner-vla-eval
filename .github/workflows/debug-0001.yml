name: Debug 0001 prewarm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: [self-hosted, Linux, X64, V100-0001]
    timeout-minutes: 20
    steps:
      - name: Disk audit (read-only)
        run: |
          df -h / /data | tail -3
          echo "=== rm dreamidv image ==="; docker rmi swr.cn-north-4.myhuaweicloud.com/link-seek/dreamidv:latest 2>&1 | tail -2 || docker rmi dreamidv:latest 2>&1 | tail -2
          echo "=== rm dreamidv data ==="; rm -rf /data/dreamidv && echo "removed /data/dreamidv"
          echo "=== after ==="; df -h / /data | tail -3; docker system df 2>&1 | head -6
