name: Debug 0001 prewarm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: [self-hosted, Linux, X64, V100-0001]
    timeout-minutes: 20
    steps:
      - name: Disk audit (read-only)
        run: |
          df -h / /tmp /data 2>/dev/null
          echo "=== docker ==="; docker system df 2>&1 | head -8
          echo "=== images ==="; docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -15
          echo "=== /tmp top ==="; du -sh /tmp/* 2>/dev/null | sort -rh | head -8
          echo "=== /data top ==="; du -sh /data/* 2>/dev/null | sort -rh | head -8
