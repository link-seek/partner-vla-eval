name: Debug 0001 prewarm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: [self-hosted, Linux, X64, V100-0001]
    timeout-minutes: 20
    steps:
      - name: Disk audit (read-only)
        run: |
          ls /data/ | head -20
          echo "=== robotwin-assets ==="; ls /data/robotwin-assets/ 2>&1 | head -5; du -sh /data/robotwin-assets/* 2>/dev/null | head -5
          echo "=== objaverse ==="; ls /data/robotwin-assets/c3ddfa8/objects/objaverse/ 2>&1 | head -5
