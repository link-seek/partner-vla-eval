name: Debug 0001 prewarm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: [self-hosted, Linux, X64, V100-0001]
    timeout-minutes: 20
    steps:
      - name: Disk audit (read-only)
        run: |
          df -h / | tail -2
          echo "=== ps ==="; docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' | head -10
          echo "=== docker root ==="; du -sh /var/lib/docker/* 2>/dev/null | sort -rh | head -6
          echo "=== who uses dreamidv ==="; docker ps -a --filter ancestor=dreamidv --format '{{.Names}} {{.Status}}' | head -5; echo "(empty=无人用)"
          echo "=== journal ==="; journalctl --disk-usage 2>/dev/null || true
