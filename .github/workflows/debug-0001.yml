name: Debug 0001 prewarm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: [self-hosted, Linux, X64, V100-0001]
    timeout-minutes: 20
    steps:
      - name: Repro prewarm verbosely
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -x
          VERIFY_IMAGE="swr.cn-north-4.myhuaweicloud.com/link-seek/vla-verify:0.1"
          docker images | grep -E "vla-verify" || true
          mkdir -p /tmp/hfdbg/.cache/hf
          docker run --rm --network host \
            -v "/tmp/hfdbg/.cache/hf":/root/.cache/huggingface \
            -e HF_ENDPOINT=https://hf-mirror.com -e HF_HUB_VERBOSITY=info \
            -e HF_TOKEN="${HF_TOKEN:-}" -e HF_HUB_DISABLE_XET=1 \
            "$VERIFY_IMAGE" hf-download download Dexmal/robotwin-db-cogact --include "grab_roller/*"; echo "docker-exit=$?"
          echo "--- hf-download version ---"
          docker run --rm "$VERIFY_IMAGE" hf-download --version; echo "ver-exit=$?"
          echo "--- df ---"; df -h /tmp /data 2>/dev/null | head -5
