name: Lint

# 每次推 main 自动跑：bash -n 全部脚本 + YAML 解析全部 workflow + composite action。
# 2026-10-22 前已因此类错误翻车 3 次（heredoc 解析、本地 action 路径、wretry 参数）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: bash -n all scripts
        run: |
          fail=0
          # 递归找（C1 下沉到 scripts/ci|gates|data 后，旧的 scripts/*.sh 已匹配不到文件，
          # 等于一个都没检查——所以下面加了"至少 N 个"的断言，空匹配直接失败）
          mapfile -t shs < <(find scripts -name '*.sh' -type f | sort)
          mapfile -t pys < <(find scripts leaderboard/scripts -name '*.py' -type f 2>/dev/null | sort)
          echo "shell scripts: ${#shs[@]}  python files: ${#pys[@]}"
          [ "${#shs[@]}" -ge 6 ] || { echo "FAIL: 只找到 ${#shs[@]} 个 shell 脚本（应 >=6），glob 可能又失效了"; fail=1; }
          [ "${#pys[@]}" -ge 6 ] || { echo "FAIL: 只找到 ${#pys[@]} 个 python 文件（应 >=6）"; fail=1; }
          for f in "${shs[@]}"; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          for f in "${pys[@]}"; do
            python3 -m py_compile "$f" || { echo "PY SYNTAX FAIL: $f"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "SYNTAX OK"
          exit $fail
      - name: Shell lint (shellcheck, errors only)
        # runner 预装 shellcheck 0.9.0，无需安装。只开 -S error：抓真 bug，不纠缠风格。
        run: find scripts -name '*.sh' -print0 | xargs -0 -r shellcheck -S error -x

      - name: YAML lint (yamllint, relaxed)
        run: |
          printf 'extends: relaxed\nrules:\n  line-length: disable\n  comments-indentation: disable\n  document-start: disable\n' > /tmp/yamllint.yml
          yamllint -c /tmp/yamllint.yml .github/workflows configs

      - name: Python static check (ruff undefined names)
        # 2026-11-25 教训：写了 os.environ / glob 但没 import，单测碰不到、bash -n 碰不到，
        # 只有真跑才崩。F821 一条就能拦住。
        run: |
          python3 -m pip install --quiet ruff
          ruff check --no-cache --select F821,F811,E9 scripts leaderboard/scripts

      - name: All gates (single entry)
        # 10 道门禁（paths/contracts/registry/versions/reports/coverage/leaderboard/stats/collect/adapter）
        # 统一由 scripts/gates/run_all.py 调度：一条命令看全部结果，失败时打印该门的完整输出。
        # 原来这里是一步一个门禁，红在哪要翻日志；合并后 CI 步骤数与门禁数解耦。
        run: |
          python3 -m pip install --quiet pyyaml numpy jsonschema
          python3 scripts/gates/run_all.py

      - name: Docs site build (jekyll, strict front matter)
        # check_docs 只校验 front-matter 字段，不能证明站点真能构建。
        # 这一步用 docs/Gemfile 起真的 jekyll，坏 front-matter / 坏 Liquid 在 PR 就红。
        # 注意：用的是 remote_theme（just-the-docs），需要网络拉主题，runner 有外网。
        run: |
          ruby -v
          cd docs
          bundle install --quiet --jobs 4
          bundle exec jekyll build --strict_front_matter --destination /tmp/_site
          test -f /tmp/_site/index.html || { echo "FAIL: 没生成 index.html"; exit 1; }
          # 只生成空壳也算失败：必须有主题资源（just-the-docs 的 css/js）
          ls -R /tmp/_site/assets 2>/dev/null | head -20
          test -d /tmp/_site/assets/css || {
            echo "FAIL: 缺主题资源 —— remote_theme 没生效（_config.yml 需要 plugins: jekyll-remote-theme）"
            exit 1; }
          echo "SITE BUILD OK ($(find /tmp/_site -name '*.html' | wc -l) 个页面)"
      - name: Workflow syntax (actionlint is a separate workflow)
        # actionlint 放在 .github/workflows/actionlint.yml（社区 action，pin 版本），此处只解析 YAML。
        run: |
          python3 -c "
          import glob, yaml, sys
          bad = []
          for f in glob.glob('.github/workflows/*.yml'):
              try: yaml.safe_load(open(f))
              except Exception as e: bad.append((f, e))
          print('YAML OK' if not bad else bad); sys.exit(1 if bad else 0)"

      - name: Script cd-depth guard (scripts in subdirs must go up 2 levels)
        # C1 回归（2026-11-24）：脚本下沉到 scripts/ci/ 后，`cd "$(dirname "$0")/.."`
        # 只到 scripts/，导致 configs/registry/model-registry.json 找不到、跑批立刻失败。
        # lint 只做 bash -n 抓不到这种运行期路径错误，故加静态断言。
        run: |
          fail=0
          for f in scripts/ci/*.sh scripts/data/*.sh; do
            if grep -q 'cd "$(dirname "$0")/\.\.\"' "$f"; then
              echo "FAIL: $f 用 /.. 上溯（在子目录里只到 scripts/，必须用 /../..）"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "CD-DEPTH OK"
          exit $fail
      - name: OBS uploads must not swallow failures
        # C6 回归门：`obsutil cp ... || true` 会让"上传失败但产物只留在机器上"变成静默事故。
        # 现在的写法是 cp 不带 || true + 回读计数，见各 workflow 的 Upload to OBS 步骤。
        run: |
          # 只查真正的命令行（行首 obsutil），并排除本文件自身（下面就是这条规则的文字）
          hits=$(grep -rnE '^[[:space:]]*obsutil cp .*\|\|[[:space:]]*true' .github/workflows/*.yml \
                 | grep -v '/lint.yml:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "FAIL: 上传失败被 || true 吞掉，改用回读校验" >&2
            exit 1
          fi
          echo "OBS-UPLOAD-GUARD OK"
      - name: No direct $WORKSPACE-mutating leftovers (results/ hygiene guard)
        run: |
          ! grep -rn "rm -rf /\s*$\|rm -rf /\*" scripts/ || { echo "DANGEROUS rm FOUND"; exit 1; }
          echo "GUARDS OK"
