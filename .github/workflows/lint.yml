name: Lint

# 每次推 main 自动跑：bash -n 全部脚本 + YAML 解析全部 workflow + composite action。
# 2026-10-22 前已因此类错误翻车 3 次（heredoc 解析、本地 action 路径、wretry 参数）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: bash -n all scripts
        run: |
          fail=0
          # 递归找（C1 下沉到 scripts/ci|gates|data 后，旧的 scripts/*.sh 已匹配不到文件，
          # 等于一个都没检查——所以下面加了"至少 N 个"的断言，空匹配直接失败）
          mapfile -t shs < <(find scripts -name '*.sh' -type f | sort)
          mapfile -t pys < <(find scripts leaderboard/scripts -name '*.py' -type f 2>/dev/null | sort)
          echo "shell scripts: ${#shs[@]}  python files: ${#pys[@]}"
          [ "${#shs[@]}" -ge 6 ] || { echo "FAIL: 只找到 ${#shs[@]} 个 shell 脚本（应 >=6），glob 可能又失效了"; fail=1; }
          [ "${#pys[@]}" -ge 6 ] || { echo "FAIL: 只找到 ${#pys[@]} 个 python 文件（应 >=6）"; fail=1; }
          for f in "${shs[@]}"; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          for f in "${pys[@]}"; do
            python3 -m py_compile "$f" || { echo "PY SYNTAX FAIL: $f"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "SYNTAX OK"
          exit $fail
      - name: YAML parse all workflows + actions
        run: |
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml') + glob.glob('.github/actions/*/action.yml')]; print('YAML OK')"
      - name: versions.yaml consistency (no silent pin drift)
        run: python3 scripts/gates/check_versions.py
      - name: Leaderboard schema + report reconciliation
        # 对照上游 leaderboard-validate.yml：榜单数据必须机器可验。
        # 额外两条本仓规则：数字要与 docs/reports 对账；shared/finetuned 不许混排。
        run: |
          python3 -m pip install --quiet jsonschema
          python3 leaderboard/scripts/check_leaderboard.py
      - name: Referenced paths must exist
        # 漂移实例：README 曾引用 scripts/upstream/run_sharded.sh（已删）、
        # 写 v0.7.0（实际 0.8.0）、"四类 workflow"（实际 25）。本步把引用可达变成门禁。
        # 计划中/上游仓路径登记在 scripts/paths_allowlist.txt。
        run: python3 scripts/gates/check_paths.py
      - name: Report self-consistency (mean_success vs success/n, image present)
        # A4：拦住"报告写 0.8.0 而 aggregate 是 0.0.0"、"mean_success 与 success/n 对不上"。
        run: python3 scripts/gates/check_reports.py
      - name: Model registry reproducibility gate
        # A1：status=verified 必须能钉住权重（ckpt_revision 40-hex），否则复现必翻车。
        run: python3 scripts/gates/check_registry.py
      - name: Coverage gate (must refuse partial models)
        # A3：缺格模型 dispatch 时就拒跑，不等到预热报 "Fetching 0 files"。
        # 这里同时测反例（CogACT 只有 3 头）与正例（X-VLA 全 5）。
        run: |
          set +e
          python3 scripts/gates/check_coverage.py --models db-cogact \
            --tasks grab_roller,adjust_bottle,place_phone_stand,click_bell,handover_block
          rc=$?
          set -e
          if [ "$rc" != "2" ]; then
            echo "FAIL: 缺格模型应返回 2（拒跑），实际 $rc" >&2
            exit 1
          fi
          echo "coverage negative case OK (refused with 2)"
          python3 scripts/gates/check_coverage.py --models x-vla-robotwin2 \
            --tasks grab_roller,adjust_bottle,place_phone_stand,click_bell,handover_block
      - name: Adapter unit tests (robotwin_obs)
        # B3 最可能的失败点是观测转换（通道/归一化），这里用纯函数单测把它钉住。
        # 只依赖 numpy（CI 基础镜像没有，装一下）。
        run: |
          python3 -m pip install --quiet numpy
          python3 scripts/model_servers/test_robotwin_obs.py
      - name: Script cd-depth guard (scripts in subdirs must go up 2 levels)
        # C1 回归（2026-11-24）：脚本下沉到 scripts/ci/ 后，`cd "$(dirname "$0")/.."`
        # 只到 scripts/，导致 configs/registry/model-registry.json 找不到、跑批立刻失败。
        # lint 只做 bash -n 抓不到这种运行期路径错误，故加静态断言。
        run: |
          fail=0
          for f in scripts/ci/*.sh scripts/data/*.sh; do
            if grep -q 'cd "$(dirname "$0")/\.\.\"' "$f"; then
              echo "FAIL: $f 用 /.. 上溯（在子目录里只到 scripts/，必须用 /../..）"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "CD-DEPTH OK"
          exit $fail
      - name: OBS uploads must not swallow failures
        # C6 回归门：`obsutil cp ... || true` 会让"上传失败但产物只留在机器上"变成静默事故。
        # 现在的写法是 cp 不带 || true + 回读计数，见各 workflow 的 Upload to OBS 步骤。
        run: |
          # 只查真正的命令行（行首 obsutil），并排除本文件自身（下面就是这条规则的文字）
          hits=$(grep -rnE '^[[:space:]]*obsutil cp .*\|\|[[:space:]]*true' .github/workflows/*.yml \
                 | grep -v '/lint.yml:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "FAIL: 上传失败被 || true 吞掉，改用回读校验" >&2
            exit 1
          fi
          echo "OBS-UPLOAD-GUARD OK"
      - name: No direct $WORKSPACE-mutating leftovers (results/ hygiene guard)
        run: |
          ! grep -rn "rm -rf /\s*$\|rm -rf /\*" scripts/ || { echo "DANGEROUS rm FOUND"; exit 1; }
          echo "GUARDS OK"
