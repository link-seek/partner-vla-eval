name: RobotWin Smoke (DB-CogACT)

# RobotWin 双臂链路验证：grab_roller 1ep，不计分。
# 权重 Dexmal/robotwin-db-cogact（按 task 分头），镜像 SWR 内网。

on:
  workflow_dispatch:

# 与 molmo smoke 共用 V100，串行
concurrency:
  group: gpu-ecs-pi0-smoke
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: [self-hosted, hw21]
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/ecs-power
        with:
          action: start
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
  smoke:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100-pi0]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Run RobotWin smoke via Docker (host orchestration)
        env:
          RW_VIDEO: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
        run: |
          mkdir -p results
          chmod +x scripts/ci_robotwin.sh
          bash scripts/ci_robotwin.sh 2>&1 | tee results/ci.log; CODE=${PIPESTATUS[0]}
          echo "smoke_exit=$CODE"
          exit $CODE
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robotwin-smoke
          path: results/
      - name: Upload to OBS
        if: always()
        run: |
          obsutil cp results/ obs://${{ env.OBS_BUCKET }}/eval/robotwin-smoke/ -f -r -flat || true

  stop-ecs:
    needs: smoke
    runs-on: [self-hosted, hw21]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/ecs-power
        with:
          action: stop
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
