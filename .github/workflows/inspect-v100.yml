name: Inspect V100 Runner

# 一次性诊断：hw21 跳板 SSH 进 V100，只看 runner 现状不动手。
# 密码走 secret，日志里只回显状态，不回显任何密钥材料。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, hw21]
    timeout-minutes: 20
    steps:
      - name: SSH helper (askpass, no sshpass needed)
        run: |
          mkdir -p ~/.ssh-runner-fix
          cat > ~/.ssh-runner-fix/askpass.sh << EOF
          #!/bin/sh
          echo "\$V100_SSH_PASS"
          EOF
          chmod 700 ~/.ssh-runner-fix/askpass.sh
          cat > ~/.ssh-runner-fix/ssh.sh << 'EOF'
          #!/bin/sh
          export SSH_ASKPASS="$HOME/.ssh-runner-fix/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          exec setsid ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$@"
          EOF
          chmod 700 ~/.ssh-runner-fix/ssh.sh
      - name: Probe SSH then inspect runner dirs
        env:
          V100_SSH_PASS: ${{ secrets.V100_SSH_PASS }}
        run: |
          export V100=114.116.228.0
          echo "== net diag =="
          env | grep -i -E "proxy" | sed 's/=.*/=***/' | head -n 10
          getent hosts github.com | head -n 2
          getent hosts 192.168.0.9 | head -n 2
          curl -s --max-time 10 https://api.github.com/meta -o /dev/null -w "github-api:%{http_code}\n" || echo "github-api FAIL"
          curl -s --max-time 8 https://icanhazip.com; echo " <- hw21 egress"
          command -v ssh curl python3
          echo "== probe 22 =="
          (echo > /dev/tcp/$V100/22) 2>/dev/null && echo "port 22 OPEN" || echo "port 22 CLOSED"
          echo "== runner dirs =="
          ~/.ssh-runner-fix/ssh.sh root@$V100 'ls -d ~/actions-runner* /opt/actions-runner* /root/*runner* 2>/dev/null; echo "---"; ps aux | grep -i "Runner.Listener" | grep -v grep | head -n 5; echo "---"; systemctl list-units --type=service --state=running 2>/dev/null | grep -i -E "runner|actions" | head -n 5; echo "---"; ls /etc/systemd/system/ 2>/dev/null | grep -i -E "runner|actions" | head -n 5' 2>&1 | tail -n 30
          echo "== deep dive =="
          ~/.ssh-runner-fix/ssh.sh root@$V100 'cat /etc/systemd/system/actions.runner.link-seek.ecs-0002-org.service; echo "==="; systemctl status actions.runner.link-seek.ecs-0002-org --no-pager 2>&1 | head -n 12; echo "==="; find / -maxdepth 4 -name "Runner.Listener" -o -maxdepth 4 -name ".credentials" 2>/dev/null | head -n 10; echo "==="; ls ~ /opt /srv /home 2>/dev/null' 2>&1 | tail -n 40
          echo "inspect exit=$?"
