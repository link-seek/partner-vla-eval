name: secret-hygiene

# 本仓 public：一粒真值都不能进。用 gitleaks（社区维护的规则库）替代自研 grep。
# 允许清单见 .gitleaks.toml（仅已知占位/环境变量引用/二进制导出物）。
# 抄自 link-seek/docker-images 的同名 workflow（house 标准）：
# 走 `gh release download` 取 binary，避免 gitleaks-action 对组织的 license 要求。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks 真值扫描
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=v8.30.1
          gh release download "$V" -R gitleaks/gitleaks -p 'gitleaks_8.30.1_linux_x64.tar.gz' -D /tmp/gl --clobber
          tar xzf /tmp/gl/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact -c .gitleaks.toml
          echo "OK: gitleaks clean"
