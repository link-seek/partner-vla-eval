name: Repair V100-0001 Runner

# 0001（c5b805bd）GitHub runner 装机：单 agent，名字 ecs-0001-org，标签 V100,V100-0001。
# 与 0002（repair-v100.yml）彻底隔离。注册 token 现场 mint，用完即焚。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, hw21]
    timeout-minutes: 30
    steps:
      - name: Power on 0001
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          set -e
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="cn-north-4" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="c5b805bd-5e8d-4ba5-a5ab-7523244da0fa"
          for i in $(seq 1 12); do
            sleep 60
            RAW=$(hcloud ECS ListServersDetails --cli-region="cn-north-4" --cli-access-key="${{ secrets.OBS_AK }}" --cli-secret-key="${{ secrets.OBS_SK }}" --limit=25 2>&1)
            ST=$(echo "$RAW" | python3 -c "import json,sys; d=json.load(sys.stdin); print([s['status'] for s in d['servers'] if s['id']=='c5b805bd-5e8d-4ba5-a5ab-7523244da0fa'][0])" 2>/dev/null || echo UNKNOWN)
            echo "poll $i: $ST (want ACTIVE)"
            [ "$ST" = "ACTIVE" ] && { echo "power-verified: ACTIVE"; exit 0; }
          done
          echo "power-timeout: never reached ACTIVE" >&2
          exit 1
      - name: Mint runner registration token (repo)
        id: mint
        env:
          MINT_TOKEN: ${{ secrets.PROD_GH_TOKEN }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $MINT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/link-seek/partner-vla-eval/actions/runners/registration-token)
          TOKEN=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))")
          [ -n "$TOKEN" ] || { echo "mint failed: $(echo "$RESP" | head -c 300)"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "minted ok"
      - name: SSH helper
        run: |
          mkdir -p ~/.ssh-runner-0001 && chmod 700 ~/.ssh-runner-0001
          cat > ~/.ssh-runner-0001/askpass.sh << EOF
          #!/bin/sh
          echo "\$V100_SSH_PASS"
          EOF
          chmod 700 ~/.ssh-runner-0001/askpass.sh
          cat > ~/.ssh-runner-0001/ssh.sh << 'EOF'
          #!/bin/sh
          export SSH_ASKPASS="$HOME/.ssh-runner-0001/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          exec setsid ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$@"
          EOF
          chmod 700 ~/.ssh-runner-0001/ssh.sh
      - name: Install agent on 0001
        env:
          V100_SSH_PASS: ${{ secrets.V100_SSH_PASS }}
          REG_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -o pipefail
          TAG=$(curl -sS -m 30 https://api.github.com/repos/actions/runner/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "runner version: $TAG"
          ~/.ssh-runner-0001/ssh.sh root@1.94.192.234 "REG_TOKEN='$REG_TOKEN' RUNNER_TAG='$TAG' bash -s" << 'REMOTE' 2>&1 | tee /tmp/repair-0001.log; CODE=${PIPESTATUS[0]}
          set -e
          id runner 2>/dev/null || useradd -m -s /bin/bash runner
          usermod -aG docker runner || true
          id runner
          mkdir -p /data/gh-runner && chown runner:runner /data/gh-runner
          cd /data/gh-runner
          if [ ! -f ./config.sh ]; then
            su -s /bin/bash runner -c "curl -sSL --retry 3 -o /data/gh-runner/actions-runner.tar.gz 'https://github.com/actions/runner/releases/download/$RUNNER_TAG/actions-runner-linux-x64-${RUNNER_TAG#v}.tar.gz' && tar xzf /data/gh-runner/actions-runner.tar.gz -C /data/gh-runner"
            chown -R runner:runner /data/gh-runner
          fi
          ./svc.sh stop || true
          ./svc.sh uninstall || true
          su -s /bin/bash runner -c "cd /data/gh-runner && ./config.sh remove --token '$REG_TOKEN' || true"
          su -s /bin/bash runner -c "cd /data/gh-runner && ./config.sh --unattended --url https://github.com/link-seek/partner-vla-eval --token '$REG_TOKEN' --name ecs-0001 --labels V100,V100-0001 --work _work"
          ./svc.sh install runner
          ./svc.sh start
          echo "== status =="
          systemctl is-active "actions.runner.link-seek.partner-vla-eval.ecs-0001.service" || true
          sleep 15
          ps aux | grep -c "[R]unner.Listener"
          REMOTE
          echo "remote exit=$CODE"
          tail -n 20 /tmp/repair-0001.log
          exit $CODE
      - name: Verify runner online
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          sleep 20
          gh api repos/link-seek/partner-vla-eval/actions/runners --jq '.runners[] | select(.name=="ecs-0001") | "\(.name) \(.status) \(.labels[].name)"' | head -5
