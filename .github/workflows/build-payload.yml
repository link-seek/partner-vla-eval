name: Build Payload

# 代码 payload 镜像：V100 执行侧唯一代码来源（SWR 内网拉，不碰 github）。
# main 推即打（scripts/configs/docker 变更才有意义，paths 过滤），tag=<sha> + latest。

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "configs/**"
      - "docker/Dockerfile.payload"
      - "docker/versions.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SWR_REG: swr.cn-north-4.myhuaweicloud.com/link-seek

jobs:
  build-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Login SWR (HMAC)
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          echo "$LOGIN_KEY" | docker login -u "cn-north-4@${{ secrets.OBS_AK }}" --password-stdin swr.cn-north-4.myhuaweicloud.com
      - name: Build + push payload (:sha + :latest)
        run: |
          SHA="$(git rev-parse --short HEAD)"
          docker build -f docker/Dockerfile.payload -t "${{ env.SWR_REG }}/vla-payload:${SHA}" -t "${{ env.SWR_REG }}/vla-payload:latest" .
          docker push "${{ env.SWR_REG }}/vla-payload:${SHA}"
          docker push "${{ env.SWR_REG }}/vla-payload:latest"
