name: LIBERO Smoke (pi05)

# LIBERO 单臂基线 smoke：spatial 1 task x 1ep，只验链路。

on:
  workflow_dispatch:
    inputs:
      serve_yaml:
        description: "serve 配置（如 serve-smolvla-libero.yaml）"
        required: false
        default: "serve-pi05-libero.yaml"
      run_yaml:
        description: "run 配置"
        required: false
        default: "run-libero-smoke.yaml"
      serve_image:
        description: "serve 镜像（X-VLA 用 vla-serve-xvla:0.7.0）"
        required: false
        default: "swr.cn-north-4.myhuaweicloud.com/link-seek/vla-serve-pi05:0.7.0"
      serve_cuda:
        description: "serve 可见卡（默认 0；双卡分片用 0,1）"
        required: false
        default: "0"
      bench_image:
        description: "benchmark 镜像（0.8.0 已同步到 SWR）"
        required: false
        default: "swr.cn-north-4.myhuaweicloud.com/link-seek/vla-eval-libero:0.8.0"
      volumes:
        description: "分号分隔的 -v 挂载（P2  instrumentation 用）"
        required: false
        default: 

concurrency:
  group: gpu-ecs-pi0-smoke
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: [self-hosted, hw21]
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/ecs-power
        with:
          action: start
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
  smoke:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100-pi0]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Run LIBERO smoke
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          SERVE_YAML: ${{ inputs.serve_yaml }}
          RUN_YAML: ${{ inputs.run_yaml }}
          SERVE_IMAGE: ${{ inputs.serve_image }}
          SERVE_CUDA: ${{ inputs.serve_cuda }}
          LIBERO_IMAGE: ${{ inputs.bench_image }}
          LIBERO_VOLUMES: ${{ inputs.volumes }}
        run: |
          mkdir -p results
          chmod +x scripts/ci_libero.sh
          bash scripts/ci_libero.sh 2>&1 | tee results/ci.log; CODE=${PIPESTATUS[0]}
          echo "smoke_exit=$CODE"
          exit $CODE
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libero-smoke
          path: results/
      - name: Upload to OBS
        if: always()
        run: |
          obsutil cp results/ obs://${{ env.OBS_BUCKET }}/eval/libero-smoke/ -f -r -flat || true

  stop-ecs:
    needs: smoke
    runs-on: [self-hosted, hw21]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/ecs-power
        with:
          action: stop
          obs-ak: ${{ secrets.OBS_AK }}
          obs-sk: ${{ secrets.OBS_SK }}
