name: Post-run Collect (matrix → reports → leaderboard)

# 目的：Model Matrix 跑完自动收数、回填报告、更新榜单并提交。
# 为什么需要：跑完 stop-ecs 会关机，aggregate 只在 OBS 私桶；而容器里没有 obsutil。
# 所以由 matrix workflow 把汇总挂成 Actions artifact，本 workflow 从 artifact 取。
#
# 只处理带 artifact 的 run（2026-11-24 之后）。更早的 run 需人工开机取数。

on:
  workflow_run:
    workflows: ["Model Matrix (base models x exam tasks)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "要回填的 matrix run id（手动补收用）"
        required: true

concurrency:
  group: post-run-collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  collect:
    # 失败也要收（部分 task 可能已出数），但不能因为 cancelled 白跑
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch collected summary artifact
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/collected

      - name: Show what we got
        run: |
          echo "run=${{ github.event.workflow_run.id || inputs.run_id }} conclusion=${{ github.event.workflow_run.conclusion }}"
          ls -l /tmp/collected 2>/dev/null || echo "（无 artifact）"

      - name: Fallback — pull matrix/ from OBS
        id: obs-fallback
        # 兜底：早于 artifact 步骤的 run 没有 artifact，但 Upload to OBS 已把 matrix/ 传上去。
        # 这里装 obsutil 拉回来，转成与 artifact 相同的形状（/tmp/collected/collected-*.json）。
        if: steps.fetch.outcome != 'success'
        continue-on-error: true
        env:
          OBS_AK: ${{ secrets.PROD_HCLOUD_AK }}
          OBS_SK: ${{ secrets.PROD_HCLOUD_SK }}
          EP: https://obs.cn-north-4.myhuaweicloud.com
          SRC: obs://so101-sim-pipeline/eval/leaderboard
        run: |
          set -e
          curl -sSL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz" -o /tmp/obsutil.tgz
          tar -xzf /tmp/obsutil.tgz -C /tmp
          OBSUTIL=$(ls -d /tmp/obsutil_linux_amd64_*/obsutil | head -1); chmod +x "$OBSUTIL"
          mkdir -p /tmp/collected
          for proto in hard easy; do
            echo "--- try $proto"
            "$OBSUTIL" cp "$SRC/$proto/matrix/" ./matrix -r -f -e "$EP" -i "$OBS_AK" -k "$OBS_SK" 2>&1 | tail -3 || true
            [ -d matrix ] || continue
            for m in $(ls matrix); do
              [ -d "matrix/$m" ] || continue
              out="/tmp/collected/collected-${m}-${proto}.json"
              bash scripts/data/collect_matrix.sh "$m" "$proto" matrix > "$out" 2>/dev/null || true
              python3 scripts/data/drop_if_empty.py "$out" || true
            done
            ls -l /tmp/collected || true
            [ -n "$(ls /tmp/collected 2>/dev/null)" ] && break
          done

      - name: Install python deps (numpy)
        if: always() && (steps.fetch.outcome == 'success' || steps.obs-fallback.outcome == 'success')
        run: python3 -m pip install --quiet numpy

      - name: Backfill reports + leaderboard
        if: always() && (steps.fetch.outcome == 'success' || steps.obs-fallback.outcome == 'success')
        run: |
          set -e
          shopt -s nullglob
          found=0
          for f in /tmp/collected/*/collected-*.json /tmp/collected/collected-*.json; do
            [ -f "$f" ] || continue
            found=1
            echo "=== $f"
            proto=$(python3 -c "import json,sys; print(json.load(open('$f'))['protocol'])")
            echo "protocol=$proto"
            python3 scripts/data/gen_reports.py "$f" "$proto"
            python3 scripts/data/make_leaderboard.py "$f" "$proto" \
              --run "${{ github.event.workflow_run.id || inputs.run_id }}"
          done
          [ "$found" = 1 ] || { echo "artifact 里没有 collected-*.json"; exit 1; }

      - name: Gates
        if: always() && (steps.fetch.outcome == 'success' || steps.obs-fallback.outcome == 'success')
        run: |
          python3 scripts/gates/check_reports.py
          python3 leaderboard/scripts/check_leaderboard.py

      - name: Commit results
        if: always() && (steps.fetch.outcome == 'success' || steps.obs-fallback.outcome == 'success')
        run: |
          set -e
          git config user.name "post-run-collect"
          git config user.email "noreply@link-seek.local"
          git add docs/data leaderboard
          if git diff --cached --quiet; then
            echo "无变化，不提交"
          else
            git commit -m "chore(auto): 收数 run ${{ github.event.workflow_run.id || inputs.run_id }} → 报告 hard_success/gap + 榜单"
            git push
          fi
