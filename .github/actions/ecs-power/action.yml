name: "ECS power with verify"
description: "Start/stop V100 ECS and poll until the target state, then verify runners(optional). Fixes fire-and-forget start-ecs."

inputs:
  action:
    description: "start or stop"
    required: true
  server-id:
    required: false
    default: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  region:
    required: false
    default: cn-north-4
  timeout-min:
    description: 开机验证曾超 10 分钟，默认 12
    required: false
    default: "12"
  obs-ak:
    required: true
  obs-sk:
    required: true

runs:
  using: composite
  steps:
    - name: Setup hcloud CLI (pinned 7.3.12, verified locally)
      shell: bash
      run: |
        HCLOUD_VER="7.3.12"
        curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/${HCLOUD_VER}/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz || 
        curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
        tar -xzf /tmp/hcloud.tar.gz -C /tmp/
        sudo mv -f /tmp/hcloud /usr/local/bin/hcloud
        hcloud version 2>&1 | head -n 1 || true
    - name: Power + verify
      shell: bash
      env:
        HCLOUD_AGREE_PRIVACY: "true"
      run: |
        if [ "${{ inputs.action }}" = "start" ]; then
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ inputs.region }}" \
            --cli-access-key="${{ inputs.obs-ak }}" \
            --cli-secret-key="${{ inputs.obs-sk }}" \
            --os-start.servers.1.id="${{ inputs.server-id }}"
          WANT="ACTIVE"
        else
          sleep 120
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ inputs.region }}" \
            --cli-access-key="${{ inputs.obs-ak }}" \
            --cli-secret-key="${{ inputs.obs-sk }}" \
            --os-stop.servers.1.id="${{ inputs.server-id }}"
          WANT="SHUTOFF"
        fi
        for i in $(seq 1 ${{ inputs.timeout-min }}); do
          sleep 60
          # NOTE: 不用 ShowServer（要 project_id，runner 无 profile；ListServersDetails 已验证可行）
          RAW=$(hcloud ECS ListServersDetails --cli-region="${{ inputs.region }}" --limit=25 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print([s['status'] for s in d['servers'] if s['id']=='${{ inputs.server-id }}'][0])" 2>/dev/null || echo UNKNOWN)
          ST=$(echo "$RAW" | python3 -c "import json,sys; print(json.load(sys.stdin)['server']['status'])" 2>/dev/null || echo UNKNOWN)
          echo "poll $i: $ST (want $WANT)"
          if [ "$ST" = UNKNOWN ]; then echo "---showserver raw (truncated)---"; echo "$RAW" | head -c 400; echo; fi
          [ "$ST" = "$WANT" ] && { echo "power-verified: $ST"; exit 0; }
        done
        echo "power-timeout: never reached $WANT" >&2
        exit 1
