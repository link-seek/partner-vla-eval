# GitHub Pages（项目站，发布源：main 分支 /docs；主题 just-the-docs）
title: partner-vla-eval 教程
description: 伙伴模型横向评测教程（index → quickstart → anatomy → partner/operator）
remote_theme: just-the-docs/just-the-docs
baseurl: "/partner-vla-eval"
color_scheme: light
search_enabled: true
heading_anchors: true
# 插件：GitHub Pages 内置这些；本地/CI 构建必须显式声明，否则 remote_theme 不生效
# （2026-11-25 实测：不写这几行时 CI 构建 0.34s 通过但没有主题资源 = 假绿）
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

markdown: kramdown
kramdown:
  input: GFM

# Mermaid 原生渲染（```mermaid 块）
mermaid:
  version: "10"

# 回顶链接（官方）
back_to_top: true
back_to_top_text: "回顶"
