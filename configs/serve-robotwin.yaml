# DB-CogACT serve 配置（RobotWin 双臂口径，自包含，不用 extends）
# 上游参考：configs/model_servers/db_cogact/robotwin2.yaml
# 权重 Dexmal/robotwin-db-cogact 按 task 分头；model_path 必须和所跑 task 对上
# （smoke 跑 grab_roller 就用 grab_roller 头，全量按 task 逐个换）。
# 与 serve-pi05.yaml 的区别：单臂 pi05（chunk 10）-> 双臂 CogACT（chunk 16，三相机）。
script: "src/vla_eval/model_servers/dexbotic/cogact.py"
args:
  model_path: Dexmal/robotwin-db-cogact/grab_roller
  port: 8000
  chunk_size: 16
  camera_keys: '["head_camera", "left_camera", "right_camera"]'
  use_text_template: false
