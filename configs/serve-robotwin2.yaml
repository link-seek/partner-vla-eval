# X-VLA serve 配置（RobotWin 双臂，参考模型，自包含，不用 extends）
# 上游：configs/model_servers/xvla/robotwin.yaml
# 权重 2toINF/X-VLA-WidowX（单仓共享权重，无子目录 hack），0.9B，官称 70/39%。
# benchmark_profile=robotwin + domain_id=6 选双臂 embodiment prompt。
script: "src/vla_eval/model_servers/xvla.py"
args:
