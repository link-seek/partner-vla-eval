# DP（RoboTwin 官方 policy/DP）serve 配置
#
# 状态：未 smoke。镜像 vla-serve-robotwin-dp 在 robotwin 环境里补了 hydra-core + dill
# （diffusion_policy 已 vendored 但缺这两个依赖）。
#
# ckpt 运行时挂到 /ckpt，官方布局：
#   <task>-<ckpt_setting>-<expert_data_num>/<checkpoint_num>.ckpt
#   例：adjust_bottle-demo_clean-100/100/500.ckpt
script: "/opt/serve/robotwin_policy.py"
args:
  policy: dp
  task_name: click_bell
  ckpt_setting: demo_clean-100
  expert_data_num: 100
  seed: 100
  checkpoint_num: 500
  action_dim: 14
  device: cuda:0
